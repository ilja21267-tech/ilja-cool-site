<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Реклама магазина</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="ad">
  <div class="ad-text">
    <span class="label">🔥 АКЦИЯ</span>
    <h1>Скидки до 50%</h1>
    <p>
      Лучшие товары по самым выгодным ценам.  
      Успей купить, пока акция не закончилась!
    </p>
    <button onclick="goShop()">Перейти в магазин</button>
  </div>

  <div class="ad-image">
    <img src="https://picsum.photos/500/400?shop" alt="Товар">
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
