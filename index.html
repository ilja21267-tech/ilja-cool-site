<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>My Space Premium</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
  <div class="logo">MY•SPACE</div>
  <nav>
    <button onclick="goTo('about')">Обо мне</button>
    <button onclick="goTo('projects')">Проекты</button>
    <button onclick="goTo('contact')">Контакт</button>
  </nav>
  <div class="burger" onclick="toggleMenu()">☰</div>
</header>

<section class="hero">
  <div class="hero-bg"></div>
  <div class="hero-content">
    <h1 id="title">Создаю стильные сайты</h1>
    <p>Все кнопки работают и сайт выглядит premium ✨</p>
    <button class="main-btn" onclick="changeText()">Нажми меня</button>
  </div>
</section>

<section id="about" class="section">
  <h2>Обо мне</h2>
  <p>Я создаю современные сайты с анимациями, параллаксом и эффектами при скролле.</p>
</section>

<section id="projects" class="section">
  <h2>Проекты</h2>
  <div class="cards">
    <div class="card" onclick="showProject(1)">Проект 1</div>
    <div class="card" onclick="showProject(2)">Проект 2</div>
    <div class="card" onclick="showProject(3)">Проект 3</div>
  </div>
</section>

<section id="contact" class="section contact">
  <h2>Связь со мной</h2>
  <form id="contactForm">
    <input type="text" id="name" placeholder="Ваше имя" required>
    <input type="email" id="email" placeholder="Email" required>
    <textarea id="message" placeholder="Ваше сообщение" required></textarea>
    <button type="submit" class="contact-btn">Отправить</button>
  </form>
</section>


<footer>
  © 2025 My Space Premium
</footer>

<script src="script.js"></script>
</body>
</html>
